name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git\db
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features

      - name: Build release executable
        run: cargo build --release --locked

      - name: Build and validate portable Windows package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\package-windows.ps1

      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: HOI4-Map-Editor-windows-x86_64
          path: |
            dist/HOI4-Map-Editor-*-windows-x64.zip
            dist/HOI4-Map-Editor-*-windows-x64.zip.sha256
            dist/RELEASE_MANIFEST.txt
          if-no-files-found: error

      - name: Check repository diff whitespace
        run: git diff --check

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libx11-dev libwayland-dev file binutils

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features

      - name: Build release executable
        run: cargo build --release --locked

      - name: Build and validate portable Linux package
        run: bash scripts/package-linux.sh --output-directory dist

      - name: Upload Linux release package
        uses: actions/upload-artifact@v4
        with:
          name: HOI4-Map-Editor-linux-x86_64
          path: |
            dist/HOI4-Map-Editor-*-linux-x86_64.tar.gz
            dist/HOI4-Map-Editor-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

      - name: Check repository diff whitespace
        run: git diff --check
